<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>추천</title>
    <script async src="//www.instagram.com/embed.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f8f9fa;
            padding: 40px 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 32px;
            font-weight: 700;
            color: #333;
            margin-bottom: 12px;
        }

        .header p {
            font-size: 16px;
            color: #666;
        }

        /* 5열 그리드 */
        .grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 16px;
        }

        @media (max-width: 1400px) {
            .grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        @media (max-width: 1024px) {
            .grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 768px) {
            .grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }
        }

        @media (max-width: 480px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }

        /* 카드 - 고정 크기 */
        .card {
            background-color: #ffffff;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            transition: box-shadow 0.3s;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .card:hover {
            box-shadow: 0 8px 24px rgba(0,0,0,0.12);
        }

        .card-header {
            padding: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #f0f0f0;
        }

        .place-name {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .map-btn {
            padding: 5px 12px;
            background-color: #F24E29;
            color: #ffffff;
            border: none;
            border-radius: 16px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .map-btn:hover {
            background-color: #d63d1f;
            transform: scale(1.05);
        }

        .map-btn:active {
            transform: scale(0.95);
        }

        .card-content {
            padding: 8px 12px 12px;
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .instagram-embed {
            margin-top: 8px;
            max-height: 480px;
            overflow: hidden;
        }

        .instagram-embed blockquote {
            margin: 0 !important;
        }

        /* 로딩 */
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #999;
            font-size: 16px;
        }

        .loading::after {
            content: '...';
            animation: dots 1.5s infinite;
        }

        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }

        /* 뱃지 */
        .badges {
            display: flex;
            gap: 6px;
            margin-top: 8px;
            flex-wrap: wrap;
        }

        .badge {
            padding: 4px 10px;
            background-color: #ffe8e3;
            color: #F24E29;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }

        /* 페이지네이션 */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 40px;
            padding-bottom: 40px;
        }

        .page-btn {
            min-width: 40px;
            height: 40px;
            padding: 0 12px;
            background-color: #ffffff;
            color: #666;
            border: 1px solid #e4e4e4;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .page-btn:hover {
            background-color: #f5f5f5;
            border-color: #F24E29;
            color: #F24E29;
        }

        .page-btn.active {
            background-color: #F24E29;
            color: #ffffff;
            border-color: #F24E29;
        }

        .page-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .page-btn:disabled:hover {
            background-color: #ffffff;
            border-color: #e4e4e4;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏕️ 추천 캠핑지</h1>
            <p>엄선된 노지캠핑 명소를 만나보세요</p>
        </div>

        <div class="loading" id="loading">데이터 로딩 중</div>
        <div class="grid" id="grid"></div>
        
        <!-- 페이지네이션 -->
        <div class="pagination" id="pagination" style="display: none;"></div>
    </div>

    <script>
        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRXIUYgOtCn0xs3kX8erZJVjzVwLw33YTbAUhRXll7d_qFoB_vWKQUXhUepIjUvaJVM2uyEsd1isi9R/pub?output=csv';
        
        const ITEMS_PER_PAGE = 10; // 5열 x 2행 = 10개
        let allData = [];
        let currentPage = 1;

        // 데이터 로드
        async function loadData() {
            try {
                const response = await fetch(SHEET_URL);
                const csv = await response.text();
                const data = parseCSV(csv);
                
                allData = data;
                console.log('로드된 데이터:', data.length, '개');
                
                displayPage(1);
                renderPagination();
            } catch (error) {
                console.error('데이터 로드 실패:', error);
                document.getElementById('loading').textContent = '데이터 로드 실패';
            }
        }

        // CSV 파싱
        function parseCSV(csv) {
            const lines = csv.split('\n');
            const data = [];
            
            for (let i = 1; i < lines.length; i++) {
                if (lines[i].trim() === '') continue;
                
                let values = lines[i].includes('\t') ? lines[i].split('\t') : lines[i].split(',');
                
                const item = {
                    name: values[0]?.trim(),
                    address: values[1]?.trim(),
                    type: values[2]?.trim(),
                    concept: values[3]?.trim(),
                    notes: values[4]?.trim(),
                    toilet: values[5]?.trim(),
                    water: values[6]?.trim(),
                    instagram: values[7]?.trim()
                };
                
                // 인스타그램이 있는 항목만 추가
                if (item.name && item.instagram) {
                    data.push(item);
                }
            }
            
            return data;
        }

        // 페이지 표시
        function displayPage(page) {
            currentPage = page;
            const grid = document.getElementById('grid');
            const loading = document.getElementById('loading');
            
            if (allData.length === 0) {
                loading.textContent = '표시할 데이터가 없습니다';
                return;
            }
            
            loading.style.display = 'none';
            grid.innerHTML = '';
            
            const startIndex = (page - 1) * ITEMS_PER_PAGE;
            const endIndex = startIndex + ITEMS_PER_PAGE;
            const pageData = allData.slice(startIndex, endIndex);
            
            pageData.forEach((item) => {
                const card = document.createElement('div');
                card.className = 'card';
                
                card.innerHTML = `
                    <div class="card-header">
                        <div class="place-name">${item.name}</div>
                        <button class="map-btn" onclick="goToMap('${item.name.replace(/'/g, "\\'")}', '${item.address.replace(/'/g, "\\'")}')">
                            지도보기
                        </button>
                    </div>
                    <div class="card-content">
                        <div class="badges">
                            <span class="badge">${item.type}</span>
                            <span class="badge">${item.concept}</span>
                        </div>
                        <div class="instagram-embed">
                            <blockquote class="instagram-media" 
                                data-instgrm-permalink="${item.instagram}" 
                                data-instgrm-version="14"
                                style="background:#FFF; border:0; border-radius:3px; box-shadow:0 0 1px 0 rgba(0,0,0,0.5); margin: 0; max-width:100%; padding:0; width:100%;">
                            </blockquote>
                        </div>
                    </div>
                `;
                
                grid.appendChild(card);
            });
            
            // 인스타그램 임베드 처리
            setTimeout(() => {
                if (window.instgrm) {
                    window.instgrm.Embeds.process();
                }
            }, 100);
            
            // 상단으로 스크롤
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // 페이지네이션 렌더링
        function renderPagination() {
            const pagination = document.getElementById('pagination');
            const totalPages = Math.ceil(allData.length / ITEMS_PER_PAGE);
            
            if (totalPages <= 1) {
                pagination.style.display = 'none';
                return;
            }
            
            pagination.style.display = 'flex';
            pagination.innerHTML = '';
            
            // 이전 버튼
            const prevBtn = document.createElement('button');
            prevBtn.className = 'page-btn';
            prevBtn.textContent = '‹';
            prevBtn.disabled = currentPage === 1;
            prevBtn.onclick = () => {
                if (currentPage > 1) {
                    displayPage(currentPage - 1);
                    renderPagination();
                }
            };
            pagination.appendChild(prevBtn);
            
            // 페이지 번호
            const maxButtons = 5;
            let startPage = Math.max(1, currentPage - Math.floor(maxButtons / 2));
            let endPage = Math.min(totalPages, startPage + maxButtons - 1);
            
            if (endPage - startPage < maxButtons - 1) {
                startPage = Math.max(1, endPage - maxButtons + 1);
            }
            
            if (startPage > 1) {
                const firstBtn = document.createElement('button');
                firstBtn.className = 'page-btn';
                firstBtn.textContent = '1';
                firstBtn.onclick = () => {
                    displayPage(1);
                    renderPagination();
                };
                pagination.appendChild(firstBtn);
                
                if (startPage > 2) {
                    const dots = document.createElement('span');
                    dots.textContent = '...';
                    dots.style.padding = '0 8px';
                    dots.style.color = '#999';
                    pagination.appendChild(dots);
                }
            }
            
            for (let i = startPage; i <= endPage; i++) {
                const pageBtn = document.createElement('button');
                pageBtn.className = 'page-btn';
                if (i === currentPage) {
                    pageBtn.classList.add('active');
                }
                pageBtn.textContent = i;
                pageBtn.onclick = () => {
                    displayPage(i);
                    renderPagination();
                };
                pagination.appendChild(pageBtn);
            }
            
            if (endPage < totalPages) {
                if (endPage < totalPages - 1) {
                    const dots = document.createElement('span');
                    dots.textContent = '...';
                    dots.style.padding = '0 8px';
                    dots.style.color = '#999';
                    pagination.appendChild(dots);
                }
                
                const lastBtn = document.createElement('button');
                lastBtn.className = 'page-btn';
                lastBtn.textContent = totalPages;
                lastBtn.onclick = () => {
                    displayPage(totalPages);
                    renderPagination();
                };
                pagination.appendChild(lastBtn);
            }
            
            // 다음 버튼
            const nextBtn = document.createElement('button');
            nextBtn.className = 'page-btn';
            nextBtn.textContent = '›';
            nextBtn.disabled = currentPage === totalPages;
            nextBtn.onclick = () => {
                if (currentPage < totalPages) {
                    displayPage(currentPage + 1);
                    renderPagination();
                }
            };
            pagination.appendChild(nextBtn);
        }

        // 지도로 이동
        function goToMap(name, address) {
            if (window.parent && window.parent.loadPage) {
                window.parent.loadPage('map');
                
                setTimeout(() => {
                    const mapFrame = window.parent.document.getElementById('contentFrame');
                    if (mapFrame && mapFrame.contentWindow) {
                        const mapWindow = mapFrame.contentWindow;
                        if (mapWindow.showPlaceByAddress) {
                            mapWindow.showPlaceByAddress(address);
                        }
                    }
                }, 500);
            }
        }

        // 초기화
        window.addEventListener('load', function() {
            loadData();
        });
    </script>
</body>
</html>
